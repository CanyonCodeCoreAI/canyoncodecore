# Global Controller Configuration — portfolio-analysis fan-out pipeline
# Lists all agents and the workflow that Ventis manages.
#
# The pipeline fans out per-ticker metrics computation, then aggregates into
# portfolio-level risk, then generates an LLM briefing. Resource classes below
# reflect each stage's real cost so the scheduler has placement decisions to make.

agents:
  # Stage 0: parse the free-text request into structured holdings + lookback
  # window (calls Bedrock directly via ventis.llm.bedrock). Cheap CPU, one
  # call per request, on the critical path before the fan-out.
  - name: IntentAgent
    redis_port: 6379
    replicas: 1
    resources:
      cpu: 1
      memory: 256
    entrypoint: agents/intent_agent.py
    provider: local
    instance_type: t3.micro

  # Stage 0b: price history fetch. Network/IO-bound, cheap CPU. Called by
  # MetricsAgent, one fetch per ticker — high fan-out, so multiple replicas.
  - name: PriceAgent
    redis_port: 6379
    replicas: 1
    resources:
      cpu: 1
      memory: 256
    entrypoint: agents/price_agent.py
    provider: local
    instance_type: t3.micro
    requirements: [yfinance]

  # Stage 1: per-ticker metrics. Cheap CPU, high fan-out (one call per holding).
  # Calls PriceAgent remotely, then computes return/vol/Sharpe/drawdown.
  - name: MetricsAgent
    redis_port: 6379
    replicas: 1
    resources:
      cpu: 1
      memory: 256
    entrypoint: agents/metrics_agent.py
    provider: local
    instance_type: t3.micro

  # Stage 2: portfolio-level risk aggregation. Single call per request; needs
  # every ticker's metrics (the barrier).
  - name: RiskAgent
    redis_port: 6379
    replicas: 1
    resources:
      cpu: 1
      memory: 256
    entrypoint: agents/risk_agent.py
    provider: local
    instance_type: t3.micro

  # Stage 3: LLM briefing via Bedrock. On the critical path, one call per
  # request.
  - name: AdvisorAgent
    redis_port: 6379
    replicas: 1
    resources:
      cpu: 1
      memory: 512
    entrypoint: agents/advisor_agent.py
    provider: local
    instance_type: t3.micro

  # The workflow, exposed as a REST API.
  - name: Workflow
    type: workflow
    api_port: 8080         # Flask REST API port
    redis_port: 6379
    replicas: 1
    workflow_file: workflow/portfolio_workflow.py
    provider: local
    instance_type: t3.micro


otel:
  destinations:
    - name: local
      protocol: grpc
      endpoint: host.docker.internal:4317
      insecure: true
      headers: {}

# Polling interval in seconds
poll_interval: 4

redis:
  host: localhost
  port: 6379
  db: 0

# EC2 defaults for `provider: EC2` replicas.
ec2:
  region: ${EC2_REGION}
  ami_id: ${EC2_AMI_ID}
  subnet_id: ${EC2_SUBNET_ID}
  security_group_ids:
    - ${EC2_SECURITY_GROUP_ID}
  ssh_user: ${EC2_SSH_USER}
  ssh_private_key_path: ${EC2_SSH_PRIVATE_KEY_PATH}

