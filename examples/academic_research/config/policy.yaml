# Access rules, evaluated most-specific-first (most `match` keys wins).
# An empty `match` is the default rule.
#
# Not optional: without this file `_load_policy_rules` returns None and
# `ventis deploy` dies on `len(None)` before any container starts.

rules:
  - match: {}
    access:
      - AcademicCoordinator
      - Workflow
