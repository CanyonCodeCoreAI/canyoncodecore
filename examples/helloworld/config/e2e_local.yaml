# Local-only Global Controller Configuration
# Same agents as config/global_controller.yaml, but provider: local everywhere
# and no `database`/EC2 blocks — for the e2e-local-helloworld skill only.

agents:
  - name: ExampleAgent
    replicas: 1
    redis_port: 6379
    resources:
      cpu: 1
      memory: 512
    entrypoint: agents/example_agent.py
    provider: local

  - name: VllmAgent
    replicas: 1
    redis_port: 6379
    resources:
      cpu: 2
      memory: 2048
    entrypoint: agents/vllm_agent.py
    provider: local

  - name: Workflow
    replicas: 1
    type: workflow
    redis_port: 6379
    api_port: 8080
    workflow_file: workflow/example_workflow.py
    provider: local

poll_interval: 5

redis:
  host: localhost
  port: 6379
  db: 0
