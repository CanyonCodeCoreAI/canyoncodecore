# Policy-Based Routing Rules — map-reduce joke writer
# Each rule defines a match condition (key-value pairs checked against the
# request context) and an access list of allowed services.
# Rules are evaluated most-specific-first (most matching keys wins).
# An empty match ({}) acts as a default fallback.
#
# This file IS optional -- `_load_policy_rules` logs "No policy file found" and
# returns [], and `_check_policy` allows everything when the rule list is empty.
# What is not safe is a half-written one: past the isfile() guard the read is
# unguarded, so an empty file (`.get("rules")` on None) or a null `rules:`
# (`None.sort()`) raises inside GlobalController.__init__ and `ventis deploy`
# dies before any container starts. Delete it or fill it; do not leave it empty.

rules:
  # Default fallback: the workflow and the one agent behind it. A service left
  # out of this list answers "Unauthorized: Policy denied access to service".
  - match: {}
    access:
      - Workflow
      - JokeAgent
