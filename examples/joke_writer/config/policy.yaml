# Policy-Based Routing Rules — map-reduce joke writer
# Each rule defines a match condition (key-value pairs checked against the
# request context) and an access list of allowed services.
# Rules are evaluated most-specific-first (most matching keys wins).
# An empty match ({}) acts as a default fallback.
#
# This file is not optional. `_load_policy_rules` returns None when it is
# missing and `_load_and_write_policies` then calls len() on that, so
# `ventis deploy` dies in GlobalController.__init__ before any container starts.

rules:
  # Default fallback: the workflow and the one agent behind it. A service left
  # out of this list answers "Unauthorized: Policy denied access to service".
  - match: {}
    access:
      - Workflow
      - JokeAgent
