# Deployment manifest for the map-reduce joke writer.
#
# `entrypoint` is the adapter, which imports the untouched-in-shape source tree.
#
# The source has no pyproject.toml, setup.py or setup.cfg, so the Dockerfile's
# `-e .` is skipped -- silently. It does not matter here: `joke_writer.py` sits
# at the project root, so it lands flat at /app, which is sys.path[0]. A source
# laid out under src/ would need its own packaging metadata to import at all.

agents:
  - name: JokeAgent
    # The fan-out. `generate_joke` is stateless, so LocalController picks a
    # replica at random per call and the workflow's N dispatched calls spread
    # across these three. N is whatever the model returns (the prompt asks for
    # three sub-topics); replicas bound how many run at once, not how many run.
    replicas: 3
    redis_port: 6379
    resources:
      cpu: 1
      memory: 1024
    entrypoint: agents/joke_agent.py
    provider: local
    # What the source imports beyond the runtime's own list, which the generator
    # prepends. boto3 is already in it, which is the whole reason the Bedrock
    # call needs nothing declared here. The graph is never executed in this
    # container, but `joke_writer.py` imports langgraph at module scope, so it
    # still has to be installed.
    requirements:
      - langgraph
      - pydantic
      - typing_extensions

  - name: Workflow
    type: workflow
    replicas: 1
    redis_port: 6379
    api_port: 8080
    workflow_file: workflow/joke_workflow.py
    provider: local

poll_interval: 5

redis:
  host: localhost
  port: 6379
  db: 0

# `provider` must be lowercase. InstanceManager.launch_all tests
# `provider == "local"` to decide whether to reserve a host port; `Local` fails
# that test, reserved_port stays None, and Local/_runtime.py raises
# `int() argument must be ... not 'NoneType'` before any container starts.
#
# The credential. `_launch_locally` passes exactly five `-e` flags, all VENTIS_*,
# and .env is excluded from the build context, so for a while the only model call
# that could work here was one that needed no secret in the container: boto3
# resolving an instance role per call. `env_file` is what changed. It points at a
# local .env, unresolved paths relative to this project root, and every container
# gets it as `docker run --env-file` -- so the key is in the environment without
# ever entering the image.
#
# What lands there is AWS_BEARER_TOKEN_BEDROCK. Nothing in this project reads it:
# botocore matches the name against bedrock-runtime's signingName and switches
# the client to bearer auth on its own, so `ventis/llm/bedrock.py` still builds a
# plain `boto3.client("bedrock-runtime")`.
#
# Deploy fails here rather than in a container: resolve_env_file checks the path
# before InstanceManager launches anything, so a missing .env is one error line
# instead of three replicas that come up and then answer
# {"status": "error", "error": "Unable to locate credentials"} on every request.
#
# What it costs: this is no longer upstream's model stack. See README.md.

# Relative to this project root, same as `entrypoint` and `workflow_file`.
# .env is gitignored and excluded from the build context; .env.example names
# what belongs in it.
#
# NOTE: this key needs PR #53 (jiajunh/can-232-...), which is still open against
# main. On main nothing reads it -- `grep -rn env_file ventis/` finds no hits --
# so the key is inert, no credential reaches the container, and every request
# answers a Bedrock credential error. `validate.py` reports that as V030 until
# the PR lands.
env_file: .env
