# The graph's three nodes, exposed as three methods on one agent.
#
# One agent, not three. `generate_topics` and `best_joke` run once per request
# and have no resource profile of their own; splitting them out would add two
# images, two dependency trees and a Redis round trip to buy nothing. What is
# hoisted is the `Send` fan-out, and that is a workflow concern.

agent:
  name: JokeAgent
  functions:
    - name: generate_topics
      description: Split a topic into three related sub-topics.
      arguments:
        - name: topic
          type: str
      returns:
        type: dict

    - name: generate_joke
      description: Write one joke about one subject.
      arguments:
        - name: subject
          type: str
      returns:
        type: dict

    - name: best_joke
      description: Pick the best joke out of the ones written for a topic.
      arguments:
        - name: topic
          type: str
        - name: jokes
          type: list
      returns:
        type: dict
