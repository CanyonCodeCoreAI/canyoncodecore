# Global Controller Configuration — synthetic Epigenomics DAG, local provider
# Lists all agents and the workflow that Ventis manages.
#
# FilterAgent/MapAgent/SortAgent get 2 replicas each since the workflow fans
# out one call per chunk to them -- exercises multi-replica scheduling on a
# purely local, LLM-free run.

agents:
  - name: SplitAgent
    replicas: 1
    redis_port: 6379
    resources:
      cpu: 1
      memory: 256
    entrypoint: agents/split_agent.py
    provider: local

  - name: FilterAgent
    replicas: 2
    redis_port: 6379
    resources:
      cpu: 1
      memory: 256
    entrypoint: agents/filter_agent.py
    provider: local

  - name: MapAgent
    replicas: 2
    redis_port: 6379
    resources:
      cpu: 1
      memory: 256
    entrypoint: agents/map_agent.py
    provider: local

  - name: SortAgent
    replicas: 2
    redis_port: 6379
    resources:
      cpu: 1
      memory: 256
    entrypoint: agents/sort_agent.py
    provider: local

  - name: DedupAgent
    replicas: 1
    redis_port: 6379
    resources:
      cpu: 1
      memory: 256
    entrypoint: agents/dedup_agent.py
    provider: local

  - name: IndexAgent
    replicas: 1
    redis_port: 6379
    resources:
      cpu: 1
      memory: 256
    entrypoint: agents/index_agent.py
    provider: local

  - name: Workflow
    replicas: 1
    type: workflow
    redis_port: 6379
    api_port: 8080
    workflow_file: workflow/epigenomics_workflow.py
    provider: local

poll_interval: 5

redis:
  host: localhost
  port: 6379
  db: 0
