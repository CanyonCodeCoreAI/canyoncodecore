# Deployment manifest for the email assistant.
#
# `entrypoint` is the adapter, which imports the untouched source tree.

agents:
  - name: EmailAssistant
    replicas: 1
    redis_port: 6379
    resources:
      cpu: 1
      memory: 1024
    entrypoint: agents/email_agent.py
    provider: Local
    # What the source imports beyond the runtime's own dependencies,
    # from pyproject.toml.
    requirements:
      - langchain>=1.0.0
      - langchain-core>=1.0.0
      - langchain-openai>=1.0.0
      - langgraph>=1.0.0
      - pydantic
      - typing_extensions
      - python-dotenv
      - html2text

  - name: Workflow
    type: workflow
    replicas: 1
    redis_port: 6379
    api_port: 8080
    workflow_file: workflow/email_workflow.py
    provider: Local

poll_interval: 5

redis:
  host: localhost
  port: 6379
  db: 0
