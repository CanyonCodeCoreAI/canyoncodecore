name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. cli-v0.1.5)'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: canyonos-macos-arm64
          - os: macos-15-intel
            asset: canyonos-macos-x86_64
          - os: ubuntu-latest
            asset: canyonos-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: canyonos-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Turborepo
        run: bun install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.15"
          enable-cache: true

      # nuitka is in the non-default "release" group, so a plain uv sync skips it.
      - name: Install the CLI and Nuitka
        run: uv sync --locked --package canyonos --group release

      # The task runs from packages/cli; arguments after "--" append to its command.
      # Uncached on purpose: the task hash does not include the runner OS.
      - name: Build standalone binary
        run: bun run build:binary --filter=canyonos -- --output-filename=${{ matrix.asset }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: packages/cli/dist/${{ matrix.asset }}

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: packages/cli/dist/${{ matrix.asset }}

# Triggered by: pushing a "cli-v*" tag directly, running manually, or cli-release-tag.yml calling
# this workflow after it auto-tags a packages/cli/pyproject.toml version bump on main.
# packages/cli/install.sh downloads the matching asset for the latest "cli-v*" release.
