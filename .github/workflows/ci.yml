name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:


permissions:
  contents: read


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: "Run Ruff: Lint changed Python files"
        run: |
          mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.py')
          if (( ${#files[@]} )); then
            uvx ruff check "${files[@]}"
          fi

      - name: "Run Ruff: Format changed Python files"
        run: |
          mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.py')
          if (( ${#files[@]} )); then
            uvx ruff format --check "${files[@]}"
          fi
      
      - name: "Install dependencies for Ty"
        run: |
            uv venv 
            uv pip install -e .
      
      - name: "Run Ty: Type Check"
        run: uvx ty check

# If you want to run this locally, install act and run "act pull_request"
# For fixing Ruff lint errors: uvx ruff check --fix .
# For fixing Ruff formatting errors: uvx ruff format .