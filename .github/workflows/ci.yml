name: CI

on:
  # No branch filter, so a PR against another PR's branch runs too.
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


permissions:
  contents: read


jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Tasks whose inputs did not change replay from this cache.
      - name: Cache turbo task results
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Turborepo
        run: bun install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.15"
          enable-cache: true

      # --locked fails the job when uv.lock is stale.
      - name: Sync the Python workspace
        run: uv sync --locked

      - name: Run lint, type check, and format check
        run: bun run check

      - name: Run tests
        run: bun run test

# If you want to run this locally, install act and run "act pull_request"
# For the same checks without act: bun run check && bun run test
# For reporting Ruff lint errors: bun run lint
# For fixing Ruff formatting errors: bun run format
