name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:


permissions:
  contents: read


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Turborepo
        run: bun install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.15"
          enable-cache: true

      # --locked fails the job when uv.lock is stale.
      - name: Sync the Python workspace
        run: uv sync --locked

      - name: Run lint, type check, and format check
        run: bun run check

# If you want to run this locally, install act and run "act pull_request"
# For the same checks without act: bun run check
# For reporting Ruff lint errors: bun run lint
# For fixing Ruff formatting errors: bun run format
