name: Tag CLI Release

on:
  push:
    branches: [main]
    # Only files that ship in the wheel or the binary cut a release. Negations must follow the positive pattern.
    paths:
      - 'packages/cli/**'
      - '!packages/cli/tests/**'
      - '!packages/cli/**.md'
      - '!packages/cli/install.sh'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Bump patch version in packages/cli/pyproject.toml
        id: bump
        run: |
          current=$(grep -m1 '^version = ' packages/cli/pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          major=$(echo "$current" | cut -d. -f1)
          minor=$(echo "$current" | cut -d. -f2)
          patch=$(echo "$current" | cut -d. -f3)
          next="$major.$minor.$((patch + 1))"
          sed -i "s/^version = \".*\"/version = \"$next\"/" packages/cli/pyproject.toml
          # uv.lock pins the member version; --locked and --frozen fail until it is refreshed.
          uv lock
          echo "tag=cli-v$next" >> "$GITHUB_OUTPUT"

      - name: Commit version bump and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/cli/pyproject.toml uv.lock
          git commit -m "cli: bump version to ${{ steps.bump.outputs.tag }} [skip release]"
          git push origin HEAD:main
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"

  release:
    needs: bump
    permissions:
      contents: write
    uses: ./.github/workflows/cli-release.yml
    with:
      tag: ${{ needs.bump.outputs.tag }}

  publish-pypi:
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Turborepo
        run: bun install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Build sdist and wheel
        run: bun run build --filter=canyonos

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ 'dist/canyonos-*'

# Calls cli-release.yml directly (a GITHUB_TOKEN tag push won't retrigger it). "[skip release]" keeps the bump commit,
# which edits packages/cli/pyproject.toml, from starting another bump.
