name: Tag CLI Release

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Bump patch version in cli/pyproject.toml
        id: bump
        run: |
          current=$(grep -m1 '^version = ' cli/pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          major=$(echo "$current" | cut -d. -f1)
          minor=$(echo "$current" | cut -d. -f2)
          patch=$(echo "$current" | cut -d. -f3)
          next="$major.$minor.$((patch + 1))"
          sed -i "s/^version = \".*\"/version = \"$next\"/" cli/pyproject.toml
          echo "tag=cli-v$next" >> "$GITHUB_OUTPUT"

      - name: Commit version bump and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cli/pyproject.toml
          git commit -m "cli: bump version to ${{ steps.bump.outputs.tag }} [skip release]"
          git push origin HEAD:main
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"

  release:
    needs: bump
    permissions:
      contents: write
    uses: ./.github/workflows/cli-release.yml
    with:
      tag: ${{ needs.bump.outputs.tag }}

  publish-pypi:
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        working-directory: cli
        run: uv build

      - name: Publish to PyPI
        working-directory: cli
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish

  update-brew-formula:
    needs: [bump, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.bump.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p bin
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --dir bin --pattern 'canyonos-*'

      - name: Update version and sha256 in Formula/canyonos.rb
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import re

          version = os.environ["RELEASE_TAG"].removeprefix("cli-v")
          assets = [
              "canyonos-macos-arm64",
              "canyonos-macos-x86_64",
              "canyonos-linux-arm64",
              "canyonos-linux-x86_64",
          ]

          formula = pathlib.Path("Formula/canyonos.rb")
          text = formula.read_text()
          text = re.sub(r'version ".*"', f'version "{version}"', text, count=1)

          for asset in assets:
              sha256 = hashlib.sha256(pathlib.Path(f"bin/{asset}").read_bytes()).hexdigest()
              text = re.sub(
                  rf'(url "[^"]*/{re.escape(asset)}"\n\s*sha256 ")[a-f0-9]+(")',
                  rf"\g<1>{sha256}\g<2>",
                  text,
              )

          formula.write_text(text)
          PY

      - name: Commit and push formula update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/canyonos.rb
          if git diff --cached --quiet; then
            echo "No formula changes to commit"
          else
            git commit -m "brew: update canyonos formula to $RELEASE_TAG [skip release]"
            git push origin HEAD:main
          fi

# Calls cli-release.yml directly (a GITHUB_TOKEN tag push won't retrigger it); "[skip release]" is a defensive backstop against the same push looping.
