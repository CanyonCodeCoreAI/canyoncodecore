[project]
name = "canyonos"
version = "0.1.0"
description = "CanyonOS CLI"
requires-python = ">=3.10"
dependencies = [
    "grpcio",
    "redis",
    "pyyaml",
    "flask",
]

[project.scripts]
canyonos = "canyonos.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canyonos*"]

[tool.setuptools.package-data]
canyonos = [
    "templates/**/*",
]
