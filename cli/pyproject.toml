[project]
name = "canyonos"
version = "0.1.2"
description = "CanyonOS CLI"
requires-python = ">=3.10"
dependencies = ["ventis @ git+https://github.com/CanyonCodeCoreAI/canyoncodecore.git"]

[project.scripts]
canyonos = "cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canyonos*"]

[tool.setuptools]
py-modules = ["cli"]
