[project]
name = "canyonos-core"
version = "0.1.0"
description = "Distributed agent orchestration framework (CanyonOS core runtime)"
requires-python = ">=3.10"
dependencies = [
    "boto3",
    "grpcio",
    "grpcio-tools",
    "redis",
    "sqlalchemy",
    "psycopg[binary]",
    "pyyaml",
    "flask",
    "requests",
    "psutil",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
]

# Import-only: the core runtime ships no console script. The user-facing `canyonos`
# executable lives in the separate `cli/` distribution. In-container entrypoints are
# invoked as `python -m canyonos_core.server` / `.cli` / `.llm_proxy`.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canyonos_core*"]

[tool.setuptools.package-data]
canyonos_core = [
    "controller/proto/*.proto",
    "controller/utils/aws_pricing_chart.db",
]

[tool.ruff]
required-version = "==0.16.7"
# Ruff 0.16.7 formats fenced examples too; CI checks Python sources, not docs.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Preserve the documented Ruff default baseline; broader rules need an
# intentional adoption pass rather than becoming CI requirements on upgrade.
select = ["E4", "E7", "E9", "F"]
# The runtime and porting validator add generated modules to sys.path before import.
ignore = ["E402"]

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
include = ["canyonos_core"]
exclude = [
    "canyonos_core/stub_generator.py",
]

[tool.ty.analysis]
allowed-unresolved-imports = [
    # These names are the deliberate flat-module fallbacks used in container images.
    "convert",
    "db",
    "gpu_metrics",
    "grpc_options",
    "llm_proxy",
    "local_controler_pb2",
    "local_controler_pb2_grpc",
    "local_controller_frontend",
    "redis_client",
    "canyonos_context",
    "deploy",
    "session_logging",
    "*_stub",
    "*_agent_stub",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # The standalone user CLI (`canyonos`) lives in cli/. It is a DISTINCT
    # distribution from this `canyonos-core` runtime, so there is no name
    # collision; the root test suite imports it to cover CLI behavior.
    "canyonos",
]

[tool.uv.sources]
canyonos = { path = "cli", editable = true }
