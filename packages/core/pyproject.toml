[project]
name = "canyonos-core"
version = "0.1.0"
description = "Distributed agent orchestration framework (CanyonOS core runtime)"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.43.91",
    "grpcio>=1.83.1",
    "grpcio-tools==1.65.5",
    "redis>=8.1.0",
    "sqlalchemy",
    "psycopg[binary]",
    "pyyaml>=6.0.3",
    "flask>=3.1.3",
    "requests>=2.34.2",
    "psutil>=7.2.2",
    "packaging>=26.3",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
]

# Import-only: the core runtime ships no console script. The user-facing `canyonos`
# executable lives in the separate `packages/cli` distribution. In-container entrypoints
# are invoked as `python -m canyonos_core.server` / `.cli` / `.llm_proxy`.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canyonos_core*"]

[tool.setuptools.package-data]
canyonos_core = [
    "controller/proto/*.proto",
    "controller/utils/aws_pricing_chart.db",
]
