# The repos under test, and which provider surfaces are open for them.
#
# Hand-supplied while the pipeline is being proven. GitHub search and automated
# selection are deliberately out of scope until the failure modes are known —
# see DESIGN.md section 5.

# Screened in scope on 2026-08-28 with `python -m skill_harness screen`.
# All four are src/ layouts with pyproject.toml, which only became portable
# once ventis build learned to install the project itself.
repos:
  - https://github.com/langchain-ai/react-agent
  - https://github.com/langchain-ai/memory-agent
  - https://github.com/langchain-ai/retrieval-agent-template
  - https://github.com/langchain-ai/data-enrichment

# Screened and rejected, kept here so the reason is not rediscovered:
#   langchain-academy   no packaging metadata and no root module (M24)
#   rag-from-scratch    notebooks only, no .py at all
#   social-media-agent  anthropic, which is closed until a repo key is supplied

# Which provider surfaces are open. A provider whose key is missing is left out,
# and the screen then rejects any repo that needs it -- at a shallow clone,
# rather than after an agent has been paid to port it.
#
# Repos keep their own provider and their own model ids: the shim swaps the key
# in and forwards everything else untouched, so nothing here swaps a provider
# (M20). `rewrite` exists only for a model id that cannot be served as written,
# and is empty on purpose.
providers:
  openai:
    key_env: OPENAI_KEY

  # Deliberately not ANTHROPIC_API_KEY: that one runs the porting agent, and
  # sharing it would blur agent spend with repo spend and let a runaway repo
  # exhaust the porting budget. Set REPO_ANTHROPIC_API_KEY to open this surface.
  anthropic:
    key_env: REPO_ANTHROPIC_API_KEY
