# The repos under test, and the model mapping the shim applies to them.
#
# Hand-supplied while the pipeline is being proven. GitHub search and automated
# selection are deliberately out of scope until the failure modes are known —
# see DESIGN.md section 5.

repos:
  - https://github.com/langchain-ai/langchain-academy
  - https://github.com/langchain-ai/rag-from-scratch

# A repo's model id is hardcoded in its source, and the source is never edited,
# so the shim rewrites the id on the way past. Anything not matched here falls to
# the per-surface default.
#
# An empty default closes that surface: the screen then rejects any repo whose
# SDK would need it, instead of letting an agent spend its budget porting a repo
# that cannot reach a model.
models:
  defaults:
    # Measured against this credential on 2026-08-28, not assumed.
    openai: openai.gpt-oss-120b-1:0

    # Closed. Every Messages-API-capable Claude on this account answers
    # `permission_error`, and Claude 3 Haiku says why: "Model use case details
    # have not been submitted for this account." Claude *is* reachable here, but
    # only through Converse — a different wire format, so routing an Anthropic
    # SDK call to it would need the protocol translation this design avoids.
    # Submitting the Anthropic use case form is what reopens this; then put
    # a model id back here and anthropic-SDK repos come back into scope.
    anthropic: ""

  exact: {}

  prefixes:
    - prefix: gpt-
      to: openai.gpt-oss-120b-1:0
    - prefix: o1
      to: openai.gpt-oss-120b-1:0
    - prefix: o3
      to: openai.gpt-oss-120b-1:0
    - prefix: o4
      to: openai.gpt-oss-120b-1:0
